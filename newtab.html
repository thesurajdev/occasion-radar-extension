<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light dark" />
<title>New Tab — Occasion Radar</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="newtab">
  <canvas id="ntSpark" class="nt-spark" aria-hidden="true"></canvas>

  <div class="nt-wrap" id="ntFull" hidden>
    <div class="nt-clock" id="ntClock">--:--</div>
    <div class="nt-date" id="ntDate">—</div>

    <form class="nt-search" action="https://www.google.com/search" method="GET">
      <svg class="nt-search-google-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
        <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
      </svg>
      <input type="text" name="q" placeholder="Search Google or type a URL" autofocus autocomplete="off" spellcheck="false" />
      <button type="submit" class="nt-search-submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#5f6368" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/>
        </svg>
      </button>
    </form>

    <div id="ntOccasionsBlock">
      <div class="nt-section-title">Coming up</div>
      <div class="nt-occasions" id="ntOccasions"></div>
    </div>

    <div class="nt-blog-slider" id="ntBlogSlider" hidden>
      <div class="nt-blog-slider-label">From the Born To Banger blog</div>
      <div class="nt-blog-track-wrap">
        <button type="button" class="nt-blog-nav nt-blog-prev" id="ntBlogPrev" aria-label="Previous post">‹</button>
        <div class="nt-blog-track" id="ntBlogTrack"></div>
        <button type="button" class="nt-blog-nav nt-blog-next" id="ntBlogNext" aria-label="Next post">›</button>
      </div>
      <div class="nt-blog-dots" id="ntBlogDots"></div>
    </div>

    <button id="ntTurnOff" class="nt-toggle-link">Turn off Occasion Radar new tab</button>
  </div>

  <!-- Shown when the person hasn't opted into using this as their new tab.
       We can't restore Chrome's real default new tab from inside an
       extension page, so this stays deliberately quiet and blank-ish. -->
  <div class="nt-wrap nt-off" id="ntOff" hidden>
    <div class="nt-clock" id="ntClockOff">--:--</div>
    <div class="nt-date" id="ntDateOff">—</div>
    <form class="nt-search" action="https://www.google.com/search" method="GET">
      <svg class="nt-search-google-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
        <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
      </svg>
      <input type="text" name="q" placeholder="Search Google or type a URL" autofocus autocomplete="off" spellcheck="false" />
      <button type="submit" class="nt-search-submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#5f6368" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/>
        </svg>
      </button>
    </form>
    <button id="ntTurnOn" class="nt-toggle-link">Show upcoming occasions here</button>
  </div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="blog-sync.js"></script>
  <script src="newtab.js"></script>
  <script src="newtab-spark.js"></script>
</body>
</html>
