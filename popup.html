<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light dark" />
<title>Occasion Radar</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="popup">
  <header class="popup-header">
    <div class="mark" aria-hidden="true"></div>
    <div class="popup-header-text">
      <h1>Occasion Radar</h1>
      <p class="subhead">by <a href="https://www.borntobanger.in" id="brandLink" target="_blank" rel="noopener">Born To Banger</a></p>
    </div>
  </header>

  <section id="upcomingList" class="upcoming-list" aria-live="polite">
    <!-- populated by popup.js -->
  </section>

  <details class="add-form-wrap" id="addFormWrap">
    <summary class="add-form-summary">
      <span class="add-form-summary-icon" aria-hidden="true">
        <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </span>
      <span>Track a birthday or anniversary</span>
    </summary>

    <form id="addForm" class="add-form">
      <div class="row">
        <label class="field-label" for="occName">Name</label>
        <input type="text" id="occName" placeholder="e.g. Rahul" required maxlength="40" autocomplete="off" />
      </div>
      <div class="row row-3">
        <div class="field">
          <label class="field-label" for="occType">Type</label>
          <select id="occType">
            <option value="birthday">Birthday</option>
            <option value="anniversary">Anniversary</option>
            <option value="custom">Custom…</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="occMonth">Month</label>
          <select id="occMonth"></select>
        </div>
        <div class="field">
          <label class="field-label" for="occDay">Day</label>
          <select id="occDay"></select>
        </div>
      </div>
      <div class="row" id="customLabelRow" hidden>
        <label class="field-label" for="occCustomLabel">Occasion name</label>
        <input type="text" id="occCustomLabel" placeholder="e.g. Work anniversary, Housewarming" maxlength="30" autocomplete="off" />
      </div>
      <button type="submit" class="btn-primary">
        <span>Add occasion</span>
      </button>
    </form>
  </details>

  <footer class="popup-footer">
    <a href="options.html" id="openOptions" class="footer-btn footer-btn-primary" target="_blank" rel="noopener">
      <span class="footer-btn-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 8h12M2 4h12M2 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span>Manage all</span>
    </a>
    <a href="https://www.borntobanger.in/activities" class="footer-btn footer-btn-secondary" target="_blank" rel="noopener">
      <span class="footer-btn-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1.5l1.9 4.1 4.4.5-3.3 3 1 4.4L8 11.3l-4 2.2 1-4.4-3.3-3 4.4-.5L8 1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </span>
      <span>Browse activities</span>
    </a>
  </footer>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
